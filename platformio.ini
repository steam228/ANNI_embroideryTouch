; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two firmwares for the same Touché circuit:
;   v2 (default) - focused sweep, oversampling, compact protocol -> TouchLab, TouchGesture, TouchGraph
;   v1           - original Illutron/Dzl 2012 sweep + protocol  -> processing/Processing_graph
; Upload v1 with: pio run -e v1 -t upload

[platformio]
default_envs = v2

[env]
platform = atmelavr
board = uno
framework = arduino

[env:v2]
build_src_filter = +<v2/>

[env:v1]
build_src_filter = +<v1/>
